<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Финансы">
<title>Finance Flow</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080c; --surface:#0d1118; --surface2:#121823;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#e8edf5; --muted:#7d899c; --dim:#4a5465;
  --accent:#22e3ff; --good:#3ee08f; --warn:#ffb547; --bad:#ff4d6a; --gold:#ffd166;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --tabbar:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.bg-glow{position:fixed;inset:-25%;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 20%,var(--glow,rgba(34,227,255,.12)),transparent 50%);transition:background 1.2s}
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000 15%,transparent 65%);mask-image:radial-gradient(circle at 50% 25%,#000 15%,transparent 65%)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--tabbar) + var(--safe-b) + 90px)}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 16px}
.topbar h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.topbar .date{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.screen{display:none;animation:fadeUp .3s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{position:relative;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.card-t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.big{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em}
.big small{font-size:14px;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 10px}
.sec-h h2{font-size:12px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.add-btn{font-size:14px;font-weight:600;color:var(--accent);padding:6px 2px}
.pos{color:var(--good)} .neg{color:var(--text)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* герой: лимит */
.hero{overflow:hidden}
.hero::before{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;pointer-events:none;background:linear-gradient(160deg,var(--hc,var(--accent)),transparent 38%,transparent 62%,var(--hc,var(--accent)));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
.hero-in{display:flex;align-items:center;gap:16px}
.ring{width:118px;height:118px;flex:0 0 118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ring .rv b{display:block;font-size:20px;color:var(--text)}
.lim-l{font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
.lim-v{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0}
.lim-s{font-size:13px;color:var(--muted)}
.lim-s b{color:var(--text);font-family:var(--mono)}
.hero-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.metric{padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.015);min-width:0}
.metric .l{font-size:10.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.metric .n{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .n small{font-size:12px;color:var(--muted);font-weight:500}
.metric.tap{cursor:pointer}
.bind{font-size:12px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);line-height:1.5}
.bind b{color:#c9d2df;font-weight:600}

.banner{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:13px;line-height:1.45}
.banner.red{border:1px solid rgba(255,77,106,.45);background:rgba(255,77,106,.08)}
.banner.yel{border:1px solid rgba(255,181,71,.35);background:rgba(255,181,71,.06)}
.banner .ic{font-size:18px;line-height:1.2}
.banner b{font-family:var(--mono)}

/* кнопки */
.btn{height:46px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;color:#06080c;background:var(--accent);box-shadow:0 8px 22px -8px var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.green{background:var(--good);box-shadow:0 8px 22px -8px var(--good)}
.btn.red{background:var(--bad);box-shadow:0 8px 22px -8px var(--bad)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,77,106,.4);box-shadow:none}
.btn.sm{height:36px;font-size:13px;padding:0 12px;border-radius:11px}
.btn:disabled{opacity:.4}
.link{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(var(--tabbar) + var(--safe-b) + 16px);z-index:30;height:56px;padding:0 22px;border-radius:18px;background:var(--accent);color:#06080c;font-weight:700;font-size:16px;box-shadow:0 12px 30px -8px var(--accent),0 0 0 1px rgba(255,255,255,.1) inset;display:flex;align-items:center;gap:8px}
.fab span{font-size:24px;line-height:1;margin-top:-2px}

/* списки */
.list{list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list .tap{cursor:pointer}
.list .d{color:var(--muted);font-size:12px;margin-top:2px}
.list .v{font-family:var(--mono);font-weight:700;white-space:nowrap}
.emo{font-size:18px;width:26px;text-align:center;flex:0 0 26px}
.chip-st{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.chip-st.ok{color:var(--good);border-color:rgba(62,224,143,.4)}
.chip-st.late{color:var(--bad);border-color:rgba(255,77,106,.45)}
.chip-st.today{color:var(--accent);border-color:rgba(34,227,255,.45)}
.chip-st.skip{color:var(--dim)}
.chip-st.flex{color:var(--gold);border-color:rgba(255,209,102,.4)}

/* календарь */
.cal-day{width:42px;flex:0 0 42px;text-align:center;font-family:var(--mono)}
.cal-day b{display:block;font-size:17px}
.cal-day span{font-size:10px;color:var(--muted);text-transform:uppercase}
.cal-day.off b{color:var(--bad)}
.occ-row.done{opacity:.55}
.occ-row.skip{opacity:.4}
.occ-row.skip .grow > div:first-child{text-decoration:line-through}
.month-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.month-h h2{font-size:17px;text-transform:capitalize}
.month-h .sub{font-family:var(--mono);font-size:12px}

/* журнал */
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);font-size:18px;color:var(--muted)}
.monthnav span{font-weight:600;min-width:110px;text-align:center;text-transform:capitalize}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum3 .metric{padding:11px 10px}
.sum3 .metric .n{font-size:16px}
.day-h{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:18px 4px 6px}
.filters{display:flex;gap:6px;overflow-x:auto;margin:14px 0 4px;scrollbar-width:none}
.filters button{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);font-size:13px;color:var(--muted);white-space:nowrap}
.filters button.on{background:rgba(34,227,255,.12);color:var(--text);border-color:rgba(34,227,255,.5)}

/* план */
.plan-row .rule{font-size:12px;color:var(--muted);margin-top:2px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.set-row:last-child{border-bottom:0}
.set-row .l{font-size:14px}
.set-row .h{font-size:12px;color:var(--muted);margin-top:2px}
.set-row input{width:120px;height:38px;border-radius:10px;background:#090c12;border:1px solid var(--line2);padding:0 10px;text-align:right;font-family:var(--mono);outline:none}

/* таббар */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:var(--safe-b);background:rgba(8,10,15,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:10.5px;font-weight:500;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}
.tab.on::before{content:"";position:absolute;top:0;width:26px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tab .dot{position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}

/* шторка */
.sheet-bg{position:fixed;inset:0;z-index:56;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:57;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#151b27,#0d1118);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + var(--safe-b));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow-y:auto}
.sheet:not(.open){visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 14px}
.sheet h2{font-size:19px;margin-bottom:4px}
.sheet > div > .sub{margin-bottom:14px}
.field{position:relative;margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.field input,.field select{width:100%;height:52px;border-radius:14px;background:#090c12;border:1px solid var(--line2);padding:0 50px 0 16px;font-family:var(--mono);font-size:20px;font-weight:700;outline:none;color-scheme:dark}
.field input.txt{font-family:var(--font);font-size:16px;font-weight:500;padding-right:16px}
.field input[type=date],.field input[type=month]{font-size:16px;padding-right:16px}
.field input.huge{height:64px;font-size:30px}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,227,255,.18)}
.field .u{position:absolute;right:16px;bottom:16px;color:var(--muted);font-family:var(--mono)}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stabs{display:flex;gap:4px;margin-bottom:12px;background:rgba(255,255,255,.03);padding:4px;border-radius:12px;border:1px solid var(--line)}
.stabs button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.stabs button.on{background:#1b2333;color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.cats button{height:60px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);padding:0 2px}
.cats button span{font-size:20px}
.cats button.on{border-color:var(--accent);color:var(--text);background:rgba(34,227,255,.08)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 14px;font-size:14px;cursor:pointer}
.toggle small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.toggle input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:background .2s;flex:0 0 46px}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(18px)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-family:var(--mono);font-weight:700;white-space:nowrap}
.alloc .kv span:first-child{color:#c9d2df}
.alloc .tot{border-top:1px solid var(--line2);border-bottom:0;margin-top:4px;padding-top:12px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.sheet .row .btn{flex:1}

/* онбординг */
#onb{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--safe-t) + 20px) 22px calc(var(--safe-b) + 22px);max-width:520px;margin:0 auto}
#onb.open{display:flex}
.onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fadeUp .35s ease}
.onb-body h2{font-size:28px;letter-spacing:-.02em;line-height:1.15;margin-bottom:10px}
.onb-body p{color:var(--muted);margin-bottom:24px;font-size:15px}
.onb-logo{width:72px;height:72px;border-radius:22px;margin-bottom:24px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(34,227,255,.3),transparent 70%);border:1px solid var(--line2);font-size:34px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--safe-b) + 84px);transform:translate(-50%,16px);opacity:0;z-index:80;background:#161d2a;border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:all .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:16px 8px}

/* итерация 2 */
.btn.gold{background:transparent;color:var(--gold);border:1px solid rgba(255,209,102,.45);box-shadow:none}
.btn.gold-s{background:var(--gold);box-shadow:0 8px 22px -8px var(--gold)}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin:10px 0 6px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--gold);box-shadow:0 0 10px rgba(255,209,102,.5);transition:width 1s}
.plan{font-size:13px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);line-height:1.6}
.plan b{color:var(--text);font-family:var(--mono)}
.calc{margin:2px 0 14px;padding:10px 12px;border-radius:12px;background:rgba(34,227,255,.05);border:1px solid rgba(34,227,255,.2)}
.calc .kv{font-size:13px}
.hbar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin:8px 0 6px}
.hbar i{display:block;height:100%;border-radius:6px}
.catrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.catrow .cn{width:96px;flex:0 0 96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .cb{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.05);overflow:hidden}
.catrow .cb i{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--accent);opacity:.85}
.catrow .cv{width:52px;text-align:right;font-weight:700}
.catrow .cp{width:34px;text-align:right;color:var(--muted);font-size:11px;font-family:var(--mono)}
.bar-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;gap:6px}
details.closed summary{cursor:pointer;list-style:none;font-family:var(--mono)}
details.closed summary::-webkit-details-marker{display:none}
.status-card{display:flex;gap:10px;align-items:center;cursor:pointer;padding:14px 16px}
.status-card .char{width:112px;height:176px;flex:0 0 112px;overflow:visible}
.ch-body{transform-origin:100px 300px;transition:transform 1.2s;animation:chB var(--pulse,2s) ease-in-out infinite}
@keyframes chB{0%,100%{scale:1 1}50%{scale:1.012 .988}}
.hs-num{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em}
.hs-word{font-size:13px;font-weight:600;margin:4px 0 10px}
.hs-part{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:5px}
.hs-part span:first-child{flex:0 0 74px}
.hs-part .hbar{flex:1;margin:0;height:5px}
</style>
</head>
<body>
<div class="bg-glow" id="bgGlow"></div>
<div class="bg-grid"></div>

<div id="app">
  <header class="topbar"><h1 id="title">Сегодня</h1><div class="date" id="todayDate"></div></header>
  <section class="screen active" data-screen="home"><div id="homeBox"></div></section>
  <section class="screen" data-screen="cal"><div id="calBox"></div></section>
  <section class="screen" data-screen="goals"><div id="goalsBox"></div></section>
  <section class="screen" data-screen="log"><div id="logBox"></div></section>
  <section class="screen" data-screen="plan"><div id="planBox"></div></section>
</div>

<button class="fab" id="fab"><span>+</span>Трата</button>

<nav class="tabbar"><div class="in" id="tabs">
  <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Сегодня</button>
  <button class="tab" data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календарь<i class="dot" id="calDot" style="display:none"></i></button>

<script>
(() => {
'use strict';

/* ======================= утилиты ======================= */
const $ = s => document.querySelector(s);

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

const money = n => (n < 0 ? '−' : '') + fmt(Math.abs(Math.round(n))) + ' ₸';

const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? c : m > 1 && m < 5 ? b : m === 1 ? a : c; };

/* даты */
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return dayKey(d); };
const diffDays = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 864e5);
const ymOf = k => k.slice(0, 7);
const ymAdd = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const monthsBetween = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + m2 - m1; };
const dim = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const ymDay = (ym, d) => `${ym}-${pad(Math.min(d, dim(ym)))}`;
const MON = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MON_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MON_S = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const shortDate = k => `${+k.slice(8)} ${MON_S[+k.slice(5, 7) - 1]}`;
const longDate = k => `${+k.slice(8)} ${MON_G[+k.slice(5, 7) - 1]}`;
const wd = k => WD[fromKey(k).getDay()];
const MON_G2 = ym => MON_G[+ym.slice(5) - 1];
const ymName = ym => `${MON[+ym.slice(5) - 1]} ${ym.slice(0, 4)}`;
const ymNameShort = ym => `${MON[+ym.slice(5) - 1]}${ym.slice(0, 4) !== String(new Date().getFullYear()) ? ' ' + ym.slice(0, 4) : ''}`;
const relDay = k => { const n = diffDays(dayKey(), k); return n === 0 ? 'сегодня' : n === 1 ? 'завтра' : n === -1 ? 'вчера' : n > 0 ? `через ${n} ${plural(n, 'день', 'дня', 'дней')}` : `${-n} ${plural(-n, 'день', 'дня', 'дней')} назад`; };

/* ======================= данные ======================= */
const KEY = 'finFlow.v1';
const CATS = [
  { id: 'food', e: '🍔', n: 'Еда' }, { id: 'transport', e: '🚕', n: 'Транспорт' }, { id: 'home', e: '🏠', n: 'Дом' },
  { id: 'fun', e: '🎉', n: 'Развлечения' }, { id: 'health', e: '💊', n: 'Здоровье' }, { id: 'clothes', e: '👕', n: 'Одежда' },
  { id: 'subs', e: '📱', n: 'Связь и подписки' }, { id: 'other', e: '📦', n: 'Другое' }
];
const defaults = () => ({
  v: 1,
  profile: { onboarded: false, startBalance: 0, startDate: null, floor: 0, boundary: 2, createdAt: new Date().toISOString() },
  schedule: [],   // правила доходов и платежей

}
function normItem(it) {

    day: clamp(Math.round(+it.day || 1), 1, 31), dayTo: it.dayTo ? clamp(Math.round(+it.dayTo), 1, 31) : null,
    shift: ['before', 'after', 'none'].includes(it.shift) ? it.shift : (it.kind === 'income' ? 'before' : 'after'),

    startMonth: it.startMonth || ymOf(dayKey()), endMonth: it.endMonth || null, prevMonth: !!it.prevMonth,

}
let S = (() => { try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return defaults(); } })();
let ver = 0;
function save() {
  ver++; offCache = {};
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ Не удалось сохранить. Сделайте экспорт'); }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
const cat = id => S.cats.find(c => c.id === id) || { id, e: '📦', n: 'Другое' };
const item = id => S.schedule.find(i => i.id === id);

/* ======================= праздники РК ======================= */
// Нерабочие праздники. Если светский праздник выпал на выходной — следующий рабочий день тоже выходной.
// Рождество (7 января) — религиозный, не переносится. Курбан айт и переносы по постановлениям — добавляются вручную.
const HOL = [['01-01', 'Новый год'], ['01-02', 'Новый год'], ['01-07', 'Рождество', 1], ['03-08', '8 Марта'], ['03-21', 'Наурыз'], ['03-22', 'Наурыз'], ['03-23', 'Наурыз'],
  ['05-01', 'День единства'], ['05-07', 'День защитника Отечества'], ['05-09', 'День Победы'], ['07-06', 'День столицы'], ['08-30', 'День Конституции'],
  ['10-25', 'День Республики'], ['12-16', 'День Независимости']];
let offCache = {};
const isWeekend = k => { const g = fromKey(k).getDay(); return g === 0 || g === 6; };
function offMap(y) {

  for (const [md, n] of HOL) m.set(`${y}-${md}`, n);
  for (const [md, n, rel] of HOL) {
    if (rel) continue;
    const k = `${y}-${md}`;
    if (isWeekend(k)) { let t = addDays(k, 1); while (isWeekend(t) || m.has(t)) t = addDays(t, 1); m.set(t, n + ' (перенос)'); }
  }

}
const holidayName = k => offMap(+k.slice(0, 4)).get(k) || null;
const isOff = k => isWeekend(k) || !!holidayName(k);
function shiftDay(k, rule) {
  if (rule === 'before') while (isOff(k)) k = addDays(k, -1);

}

/* ======================= расписание ======================= */
// Убывающий платёж: первый платёж = amount, равномерно снижается, сумма за весь срок = total.
function itemAmount(it, ym) {
  if (it.overrides && it.overrides[ym] != null) return it.overrides[ym];
  if (it.mode === 'dec' && it.endMonth && it.total) {
    const n = monthsBetween(it.startMonth, it.endMonth) + 1, i = monthsBetween(it.startMonth, ym);
    if (n <= 1) return it.amount;
    const last = 2 * it.total / n - it.amount, step = (it.amount - last) / (n - 1);
    return Math.max(0, Math.round(it.amount - i * step));
  }
  return it.amount;
}
function decLast(it) { const n = monthsBetween(it.startMonth, it.endMonth) + 1; return n > 1 ? Math.round(2 * it.total / n - it.amount) : it.amount; }
/* ======================= бюджетный месяц ======================= */
// Бюджетный месяц начинается с первой «своей» зарплаты месяца (у вас ЗП 15-го) и длится до следующей.
// Записи с отметкой «относится к прошлому месяцу» (аренда 1-го, кредиты 2-го, фриланс 2-го и 6–10-го)
// закрываются / зарабатываются в предыдущем бюджете, даже если фактически приходят в следующем месяце.
const bymOfItem = (it, ym) => it.prevMonth && !it.flexible ? ymAdd(ym, -1) : ym;
const bsCache = {};
function bStart(bym) {
  const k = bym + '|' + ver;
  if (bsCache[k]) return bsCache[k];
  const ds = S.schedule.filter(it => it.kind === 'income' && !it.prevMonth && !it.paused && (!it.startMonth || it.startMonth <= bym) && (!it.endMonth || it.endMonth >= bym))
    .map(it => shiftDay(ymDay(bym, it.day), it.shift));
  return (bsCache[k] = ds.length ? ds.sort()[0] : ymDay(bym, 1));
}
const bEnd = bym => addDays(bStart(ymAdd(bym, 1)), -1);
const bymOfDate = k => k >= bStart(ymOf(k)) ? ymOf(k) : ymAdd(ymOf(k), -1);
const bRange = bym => `${shortDate(bStart(bym))} – ${shortDate(bEnd(bym))}`;
const curBym = () => bymOfDate(dayKey());
function nextBudgetStart() {
  const t = dayKey(), c = bStart(ymOf(t));
  return c > t ? c : bStart(ymAdd(ymOf(t), 1));
}
const txBym = t => {
  if (t.occKey) { const [id, ym] = t.occKey.split('|'); const it = item(id); if (it) return bymOfItem(it, ym); }
  return bymOfDate(t.date);
};

function genOcc(fromYm, toYm, all) {
  const out = [];
  for (const it of S.schedule) {
    if (it.paused) continue;
    for (let ym = fromYm; ym <= toYm; ym = ymAdd(ym, 1)) {
      if (it.startMonth && ym < it.startMonth) continue;
      if (it.endMonth && ym > it.endMonth) continue;
      const key = it.id + '|' + ym, st = S.occ[key] || {};
      let raw, early, date;
      if (it.flexible) { early = bStart(ym); raw = bEnd(ym); date = raw; }   // «в течение месяца» = в течение бюджетного месяца
      else {
        raw = ymDay(ym, it.day); early = shiftDay(raw, it.shift);
        date = it.dayTo ? shiftDay(ymDay(ym, it.dayTo), it.shift) : early;
      }
      if (st.date) { date = st.date; if (!it.dayTo && !it.flexible) early = st.date; }
      out.push({ key, it, ym, bym: bymOfItem(it, ym), kind: it.kind, name: it.name, amount: st.amt ?? itemAmount(it, ym), raw, early, date,
        flex: it.flexible, win: !!it.dayTo && !st.date, status: st.st || null, txId: st.txId || null, st });
    }
  }
  const sd = S.profile.startDate || dayKey();
  return out.filter(o => all || o.status || o.date >= sd)
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.kind === b.kind ? 0 : a.kind === 'income' ? -1 : 1);
}

/* ======================= баланс ======================= */
const txSign = t => t.type === 'income' ? 1 : t.type === 'adjust' ? 1 : -1;
const balance = () => (S.profile.startBalance || 0) + S.tx.reduce((s, t) => t.noBal ? s : s + txSign(t) * t.amount, 0);
const spentOn = k => S.tx.filter(t => t.type === 'expense' && t.date === k && !t.noBal).reduce((s, t) => s + t.amount, 0);

/* ======================= ровный лимит ======================= */
// Максимальный одинаковый дневной лимит L, при котором баланс в конце любого дня горизонта не опускается ниже «неприкосновенного остатка»:
//   для каждого дня d:  B0 + (доходы − платежи до конца d) − floor ≥ L × (d + 1)   →   L = min по d.
// B0 — баланс на начало сегодняшнего дня (сегодняшние траты возвращаются обратно, они входят в лимит сегодня).
const H = 400;
function calcL(B0, evs, floor) {
  const net = new Float64Array(H + 1);
  for (const e of evs) if (e.d >= 0 && e.d <= H) net[e.d] += e.a;
  const cum = new Float64Array(H + 1);
  let c = 0, L = Infinity, bind = 0;
  for (let d = 0; d <= H; d++) {
    c += net[d]; cum[d] = c;
    const l = (B0 + c - floor) / (d + 1);
    if (l < L) { L = l; bind = d; }
  }
  return { L, bind, cum };
}
let FC = null;
function forecast() {
  const today = dayKey();
  if (FC && FC.ver === ver && FC.today === today) return FC;
  const tYm = ymOf(today), floor = S.profile.floor || 0;
  const occ = genOcc(ymAdd(tYm, -2), ymAdd(tYm, 14));
  const pending = occ.filter(o => !o.status);
  const bal = balance(), spent = spentOn(today), B0 = bal + spent;
  const fixed = [], flex = [], overdueInc = [], overduePay = [];
  for (const o of pending) {
    if (o.kind === 'income') {
      if (o.date < today) overdueInc.push(o);           // окно прошло, а дохода нет — в прогноз не берём, спросим
      else fixed.push({ d: diffDays(today, o.date), a: o.amount, o });
    } else if (o.flex && o.date >= today) flex.push(o);
    else {
      if (o.date < today) overduePay.push(o);           // просроченный платёж — всё ещё обязательство, считаем «на сегодня»
      fixed.push({ d: Math.max(0, diffDays(today, o.date)), a: -o.amount, o });
    }
  }
  // Гибкие платежи (отцу): перебираем дни месяца. Главный критерий — максимальный лимит L,
  // второй — максимальный минимальный запас в этом месяце (платим, когда «подушка» толще всего), при равенстве — раньше.
  const place = {}, why = {};
  for (const o of flex) place[o.key] = o.date;
  const flexEvs = () => flex.map(f => ({ d: diffDays(today, place[f.key]), a: -f.amount, o: f }));
  // Правило: среди дней, где дневной лимит максимален, выбираем день прихода дохода с лучшим балансом
  // «запас в худшей точке месяца» против «насколько позже платим»: каждый день задержки стоит 1/6 дневного лимита запаса.
  // То есть платим как можно раньше, но не ценой тонкой подушки.
  for (const o of flex) {
    const lo = o.early > today ? o.early : today, hi = o.date;
    const d0 = diffDays(today, lo), d1 = diffDays(today, hi);
    const incDays = new Set(pending.filter(x => x.kind === 'income' && x.date >= lo && x.date <= hi).map(x => x.date));
    const cands = [];
    for (let c = lo; c <= hi; c = addDays(c, 1)) {
      place[o.key] = c;

    const lam = Math.max(0, Lmax) / 6;
    const score = x => x.room - lam * diffDays(lo, x.c);
    const pick = pool.reduce((b, x) => score(x) > score(b) + 1 ? x : b, pool[0]);
    place[o.key] = pick.c;
    const first = pool[0];
    why[o.key] = first.c < pick.c ? { alt: first.c, room: first.room, worst: first.worst } : null;
  }
  const base = fixed.concat(flexEvs());
  const r0 = calcL(B0, base, floor);                        // лимит без целей
  // цели с датой: к дате на карте должна быть сумма (минус уже переведённое на отдельный счёт)
  const goalEvs = S.goals.filter(g => !g.done && g.date && gFromCard(g) > 0)
    .map(g => ({ d: Math.max(0, diffDays(today, g.date)), a: -gFromCard(g), o: { key: 'goal|' + g.id, name: g.name, goal: g, kind: 'goal', date: g.date } }));
  const evs = base.concat(goalEvs);
  const r = calcL(B0, evs, floor);
  if (S.profile.onboarded && S.profile.startBalance != null) {   // лимит дня — для статистики «уложился ли»
    const v = Math.max(0, Math.round(r.L));
    if (S.meta.limitLog[today] !== v) { S.meta.limitLog[today] = v; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  }

  let gap = null;

  const flexPlan = flex.map(o => ({ o, date: place[o.key], src: incomeBefore(occ, place[o.key], o.early), why: why[o.key] }));

  FC = { ver, today, bal, spent, B0, L: r.L, L0: r0.L, bind: r.bind, bindDate: addDays(today, r.bind), cum: r.cum, evs, occ, pending, overdueInc, overduePay, flexPlan, gap, nextInc };

}
function incomeBefore(occ, date, from) {
  const inc = occ.filter(o => o.kind === 'income' && o.date <= date && o.date >= from && o.status !== 'skip').sort((a, b) => a.date < b.date ? 1 : -1)[0];
  return inc || null;
}
const flexDate = o => { const F = forecast(), p = F.flexPlan.find(x => x.o.key === o.key); return p ? p.date : o.date; };
const planDate = o => o.flex && !o.status ? flexDate(o) : o.date;

/* распределение дохода: что покрыть до следующего поступления, сколько на жизнь, сколько отложить */
function allocation(o) {
  const F = forecast(), L = Math.max(0, F.L);
  const d0 = planDate(o);
  const incs = F.occ.filter(x => x.kind === 'income' && x.status !== 'skip' && planDate(x) > d0).map(planDate).sort();
  const next = incs[0] || addDays(d0, 15);
  const pays = F.occ.filter(x => x.kind === 'payment' && x.status !== 'skip' && !(x.status === 'done' && x.date < d0)
    && planDate(x) >= d0 && planDate(x) < next).map(x => ({ x, date: planDate(x) }));
  const sameDayInc = F.occ.filter(x => x.kind === 'income' && x.key !== o.key && x.status !== 'skip' && planDate(x) === d0);
  const days = diffDays(d0, next);
  const payTotal = pays.reduce((s, p) => s + p.x.amount, 0);
  const living = L * days;
  const inflow = o.amount + sameDayInc.reduce((s, x) => s + x.amount, 0);
  const reserve = inflow - payTotal - living;
  const after = F.occ.filter(x => x.kind === 'payment' && x.status !== 'skip' && planDate(x) >= next).map(x => ({ x, date: planDate(x) })).slice(0, 4);
  return { d0, next, pays, sameDayInc, days, payTotal, living, inflow, reserve, after, L };
}

    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - clamp(p))}" style="filter:drop-shadow(0 0 6px ${color});transition:stroke-dashoffset 1s"/></svg>`;
}
function occLine(o, opts = {}) {

  if (due.length) {

  if (flexNow.length) h += `<div class="card"><div class="card-t" style="margin-bottom:10px;color:var(--gold)">🤝 Когда лучше заплатить</div>

function bindNote(F) {
  if (F.L <= 0) return '';
  const bd = F.bindDate;
  const big = F.evs.filter(e => e.a < 0 && e.d <= F.bind).sort((a, b) => a.a - b.a).slice(0, 3);
  const n = diffDays(F.today, bd) + 1;
  return `<div class="bind">Лимит рассчитан на ${n} ${plural(n, 'день', 'дня', 'дней')} вперёд: узкое место — <b>${longDate(bd)}</b>.${big.length ? ` Его держат: ${big.map(e => `<b>${esc(e.o.name)}</b> ${shortDate(addDays(F.today, e.d))}`).join(', ')}.` : ''} Траты сверх лимита уменьшают его на завтра, экономия — увеличивает.</div>`;
}

function calRow(o, today) {
  const d = planDate(o), it = o.it, inc = o.kind === 'income';

  if (o.status === 'done') chip = '<span class="chip-st ok">✓</span>';
  else if (o.status === 'skip') chip = '<span class="chip-st skip">пропуск</span>';
  else if (d < today) chip = `<span class="chip-st late">${inc ? 'не пришло?' : 'просрочен?'}</span>`;
  else if (d === today || (o.win && o.early <= today)) chip = '<span class="chip-st today">сегодня</span>';
  else if (o.flex) chip = '<span class="chip-st flex">реком.</span>';
  const notes = [];
  if (o.flex && !o.status) notes.push(`любой день до ${shortDate(o.date)}${(() => { const p = forecast().flexPlan.find(x => x.o.key === o.key); return p && p.src ? ' · из «' + esc(p.src.name) + '»' : ''; })()}`);
  else if (o.win) notes.push(`окно ${it.day}–${it.dayTo}`);
  else if (!o.flex && o.raw !== o.date && !o.st.date) notes.push(`с ${+o.raw.slice(8)}-го: ${holidayName(o.raw) ? holidayName(o.raw).toLowerCase() : 'выходной'}`);
  if (o.st.date) notes.push('дата изменена');
  if (o.st.amt != null || (it.overrides && it.overrides[o.ym] != null)) notes.push('сумма изменена');
  if (it.mode === 'dec' && o.st.amt == null && !(it.overrides && it.overrides[o.ym] != null)) notes.push('оценка');
  if (o.bym !== ymOf(d)) notes.push(`бюджет ${MON_G2(o.bym)}`);
  return `<li class="tap occ-row ${o.status || ''}" data-occ="${o.key}">
    <div class="cal-day ${isOff(d) ? 'off' : ''}"><b>${+d.slice(8)}</b><span>${wd(d)}</span></div>
    <div class="grow"><div>${esc(o.name)}</div><div class="d">${notes.join(' · ')}</div></div>
    <div style="text-align:right"><div class="v ${inc ? 'pos' : ''}">${inc ? '+' : '−'}${fmt(o.amount)}</div>${chip}</div></li>`;
}

/* ---------- план ---------- */
function ruleText(it) {
  const parts = [];
  if (it.flexible) parts.push('в любой день месяца');
  else if (it.dayTo) parts.push(`${it.day}–${it.dayTo} числа`);
  else parts.push(it.day >= 31 ? 'последний день месяца' : `${it.day}-го`);
  if (!it.flexible) parts.push({ before: 'выходной → раньше', after: 'выходной → позже', none: 'без переноса' }[it.shift]);
  if (it.mode === 'dec') parts.push(`убывает до ~${sMoney(decLast(it))} к ${MON_S[+it.endMonth.slice(5) - 1]} ${it.endMonth.slice(0, 4)}`);
  else if (it.endMonth) parts.push(`до ${MON_S[+it.endMonth.slice(5) - 1]} ${it.endMonth.slice(0, 4)}`);
  if (it.prevMonth && !it.flexible) parts.push('→ бюджет прошлого месяца');
  if (it.isDebt) parts.push('долг');
  if (it.paused) parts.push('на паузе');
  return parts.join(' · ');
}

  let h = installCardHtml() + `<div class="card"><div class="sum3">

      <div class="set-row tap" data-act="cats" style="cursor:pointer"><div><div class="l">Категории трат</div><div class="h">${S.cats.map(c => c.e).join(' ')}</div></div><span class="sub">›</span></div>

}

/* ======================= цели ======================= */
const findGoal = id => S.goals.find(g => g.id === id);
const gSaved = g => (g.ops || []).reduce((s, o) => s + o.amount, 0);
const gMoved = g => (g.ops || []).filter(o => o.moved).reduce((s, o) => s + o.amount, 0);
const gFromCard = g => Math.max(0, g.amount - gMoved(g));     // сколько к дате должно быть на карте
const activeGoals = () => S.goals.filter(g => !g.done);
const minDaily = () => S.profile.minDaily || Math.max(1000, Math.round(Math.max(0, forecast().L0) * 0.85 / 100) * 100);

// самая ранняя дата, когда можно потратить amount с карты, не опуская лимит ниже минимума на жизнь
function earliestSafe(amount, excludeKey) {
  const F = forecast(), floor = S.profile.floor || 0, need = minDaily();
  const base = F.evs.filter(e => e.o.key !== excludeKey);
  if (amount <= 0) return { date: F.today, L: calcL(F.B0, base, floor).L };
  for (let d = 0; d <= H; d++) {
    const L = calcL(F.B0, base.concat({ d, a: -amount, o: { key: '_', name: '' } }), floor).L;
    if (L >= need) return { date: addDays(F.today, d), L };
  }
  return null;
}
// лимит с целью и без неё
function goalImpact(amount, date, excludeKey) {
  const F = forecast(), floor = S.profile.floor || 0;
  const base = F.evs.filter(e => e.o.key !== excludeKey);
  const L0 = calcL(F.B0, base, floor).L;
  if (!date || amount <= 0) return { L0, L1: L0, delta: 0 };
  const d = Math.max(0, diffDays(F.today, date));
  const L1 = calcL(F.B0, base.concat({ d, a: -amount, o: { key: '_', name: '' } }), floor).L;
  return { L0, L1, delta: L0 - L1 };
}
const monthsTo = date => Math.max(1, diffDays(dayKey(), date) / 30.44);

function goalCard(g) {
  const saved = gSaved(g), p = g.amount ? clamp(saved / g.amount) : 0, F = forecast();
  const fromCard = gFromCard(g);
  let plan = '';
  if (g.date) {
    const imp = goalImpact(fromCard, g.date, 'goal|' + g.id);
    const late = g.date < F.today;
    plan = `<div class="plan">${late ? `<b style="color:var(--bad)">Срок прошёл ${longDate(g.date)}</b>` : `К <b>${longDate(g.date)}</b> · ${relDay(g.date)}`}
      ${!late && g.amount > saved ? `<br>Откладывать ≈ <b>${fmt(Math.round((g.amount - saved) / monthsTo(g.date)))}</b> ₸/мес` : ''}
      <br>Цена для лимита: <b>−${fmt(Math.round(imp.delta))}</b> ₸/день${imp.L1 < minDaily() ? ` <span style="color:var(--warn)">· ниже минимума на жизнь (${fmt(minDaily())})</span>` : ''}</div>`;
  } else {
    const es = earliestSafe(fromCard, 'goal|' + g.id);
    plan = `<div class="plan">${es ? `Без ущерба можно к <b>${longDate(es.date)}</b> (${relDay(es.date)}) — лимит останется ≥ ${fmt(minDaily())} ₸/день` : 'В ближайший год без ущерба не получится — уменьшите сумму или минимум на жизнь'}
      <br><span style="color:var(--muted)">Без даты цель не влияет на лимит.</span></div>
      ${es ? `<button class="btn sm ghost block" style="margin-top:10px" data-g="plan" data-id="${g.id}" data-date="${es.date}">📌 Запланировать на ${longDate(es.date)}</button>` : ''}`;
  }
  return `<div class="card">
    <div class="card-h"><span style="font-weight:600;font-size:16px">${g.cushion ? '🛡' : '🎯'} ${esc(g.name)}</span>${g.date ? `<span class="chip-st ${g.date < F.today ? 'late' : 'flex'}">${shortDate(g.date)}</span>` : '<span class="chip-st">без даты</span>'}</div>
    <div class="big">${fmt(saved)} <small>/ ${fmt(g.amount)} ₸</small></div>
    <div class="pbar"><i style="width:${p * 100}%"></i></div>
    <div class="sub" style="font-size:12px">${Math.round(p * 100)}%${gMoved(g) ? ` · на отдельном счёте ${fmt(gMoved(g))}` : ''}</div>
    ${plan}
    <div class="row" style="margin-top:12px">
      <button class="btn sm gold grow" data-g="save" data-id="${g.id}">Отложить</button>
      ${g.cushion ? '' : `<button class="btn sm green grow" data-g="buy" data-id="${g.id}">Куплено</button>`}
      <button class="btn sm ghost" data-g="edit" data-id="${g.id}" aria-label="Изменить">⋯</button>
    </div></div>`;
}
function renderGoals() {
  const F = forecast(), gs = activeGoals(), done = S.goals.filter(g => g.done);
  let h = '';
  if (waiting()) h += '<div class="banner yel"><span class="ic">📅</span><span>Учёт ещё не начался — расчёты по целям приблизительные (баланс неизвестен).</span></div>';
  h += `<div class="card"><div class="sum3">
      <div class="metric"><div class="l">Лимит сейчас</div><div class="n">${fmt(Math.max(0, Math.round(F.L)))}</div></div>
      <div class="metric"><div class="l">Без целей</div><div class="n">${fmt(Math.max(0, Math.round(F.L0)))}</div></div>
      <div class="metric"><div class="l">Минимум</div><div class="n tap" data-g="min" style="cursor:pointer">${fmt(minDaily())} ✎</div></div></div>
    <p class="note" style="margin-top:10px">Цели с датой уже заложены в дневной лимит: деньги на них копятся сами. «Минимум» — ниже этого лимита цели не опускают («без ущерба»).</p></div>
    <div class="sec-h"><h2>Цели и покупки</h2><button class="add-btn" data-g="new">+ Цель</button></div>`;
  h += gs.length ? gs.map(goalCard).join('') : `<div class="card"><p class="sub">Налоги, техника, отпуск, подушка безопасности. Укажите сумму — приложение подскажет самую раннюю дату, когда это возможно без ущерба для жизни.</p>
    <button class="btn block" style="margin-top:12px" data-g="new">Добавить цель</button></div>`;
  if (done.length) h += `<details class="closed"><summary class="sub" style="padding:6px 4px">Выполнено (${done.length}) ▾</summary>
    <div class="card" style="padding:4px 14px"><ul class="list">${done.map(g => `<li class="tap" data-g="edit" data-id="${g.id}"><span class="emo">✅</span><div class="grow"><div>${esc(g.name)}</div><div class="d">${longDate(g.done)}</div></div><span class="v">${fmt(g.amount)}</span></li>`).join('')}</ul></div></details>`;
  $('#goalsBox').innerHTML = h;
}
function onGoalAct(e) {

        <div class="kv"><span>Откладывать в месяц</span><span>${fmt(Math.round(Math.max(0, amt - (g ? gSaved(g) : 0)) / monthsTo(date)))}</span></div>
        ${ok ? '' : `<p class="note" style="color:var(--warn);margin-top:6px">⚠️ Лимит опустится ниже минимума на жизнь (${fmt(minDaily())}).${es ? ` Безопасная дата — ${longDate(es.date)}.` : ''}</p>`}`;

  };
  if (g) {

    $('#gfHist').onclick = () => openGoalHist(g.id);
  }
}

/* ======================= индекс финансового здоровья ======================= */
function health() {
  const F = forecast(), b = waiting() ? bymOfDate(S.profile.startDate) : curBym();
  const occ = genOcc(ymAdd(b, -1), ymAdd(b, 2), true).filter(o => o.bym === b);
  const inc = occ.filter(o => o.kind === 'income').reduce((s, o) => s + o.amount, 0);
  const debt = occ.filter(o => o.kind === 'payment' && o.it.isDebt).reduce((s, o) => s + o.amount, 0);
  const pays = occ.filter(o => o.kind === 'payment').reduce((s, o) => s + o.amount, 0);
  const dti = inc ? debt / inc : 1;
  const sDebt = clamp((0.5 - dti) / 0.3);                                       // ≤20% — отлично, ≥50% — 0
  const cushion = S.goals.filter(g => g.cushion).reduce((s, g) => s + gSaved(g), 0);
  const monthly = pays + Math.max(0, F.L0) * 30.44;
  const months = monthly ? cushion / monthly : 0;
  const sCush = clamp(months / 3);                                              // цель — 3 месяца расходов
  const log = S.meta.limitLog || {};
  const days = Object.keys(log).filter(k => k < F.today && k >= (S.profile.startDate || F.today)).sort().slice(-30);
  const okDays = days.filter(k => spentOn(k) <= log[k] + 1).length;
  const sAdh = days.length >= 3 ? okDays / days.length : 0.5;
  const sGap = !F.gap ? 1 : F.gap.d > 31 ? 0.5 : 0;
  const parts = [
    { k: 'debt', n: 'Долговая нагрузка', w: 30, s: sDebt, v: `${Math.round(dti * 100)}% дохода`, tip: dti > 0.5 ? 'Больше половины дохода уходит на долги. Каждый закрытый кредит заметно поднимет индекс.' : dti > 0.35 ? 'Высокая нагрузка. По мере выплат (кредит 1 уменьшается каждый месяц) индекс будет расти. Цель — до 20%.' : dti > 0.2 ? 'Умеренно. Цель — до 20% дохода на долги.' : 'Отлично: долги не давят.' },
    { k: 'cush', n: 'Подушка безопасности', w: 30, s: sCush, v: `${fmt(months, 1)} мес`, tip: cushion ? `Накоплено ${fmt(cushion)} ₸. Цель — 3 месяца расходов (${fmt(Math.round(monthly * 3))} ₸).` : 'Создайте цель с отметкой «Подушка безопасности» — даже 1 месяц расходов сильно снижает стресс.' },
    { k: 'adh', n: 'Соблюдение лимита', w: 25, s: sAdh, v: days.length >= 3 ? `${okDays} из ${days.length} дн` : 'мало данных', tip: days.length >= 3 ? 'Доля дней за последний месяц, когда траты уложились в дневной лимит.' : 'Нужно хотя бы 3 дня учёта.' },
    { k: 'gap', n: 'Кассовый разрыв', w: 15, s: sGap, v: F.gap ? longDate(F.gap.date) : 'нет', tip: F.gap ? `Не хватит ${money(F.gap.short)} на обязательные платежи.` : 'На год вперёд все платежи покрываются.' }
  ];
  const score = Math.round(parts.reduce((s, p) => s + p.w * p.s, 0));
  return { score, parts, dti, months, debt, inc };
}
const scoreColor = s => s >= 70 ? 'var(--good)' : s >= 40 ? 'var(--warn)' : 'var(--bad)';
const scoreWord = s => s >= 80 ? 'Отлично' : s >= 60 ? 'Устойчиво' : s >= 40 ? 'Напряжённо' : s >= 20 ? 'Под давлением' : 'Критично';
function openHealth() {
  const h = health();
  openSheet(`<h2>Финансовое здоровье: ${h.score}</h2><p class="sub">${scoreWord(h.score)} · из 100 баллов</p>
    <ul class="list">${h.parts.map(p => `<li style="display:block"><div class="row"><span class="grow" style="font-weight:600">${p.n}</span><span class="mono" style="font-size:13px">${Math.round(p.w * p.s)} / ${p.w}</span></div>
      <div class="hbar"><i style="width:${p.s * 100}%;background:${scoreColor(p.s * 100)}"></i></div>
      <div class="d">${p.v} — ${p.tip}</div></li>`).join('')}</ul>
    <p class="note" style="margin-top:10px">Долги — платежи с отметкой «долг / кредит» в расписании.</p>

}

function charColor(t) {
  const R = [255, 45, 85], M = [176, 92, 255], B = [0, 229, 255]; t = clamp(t);
  const c = t < .5 ? R.map((v, i) => v + (M[i] - v) * t / .5) : M.map((v, i) => v + (B[i] - v) * (t - .5) / .5);
  return c.map(Math.round);
}
function characterHtml(h) {
  const t = h.score / 100, c = charColor(t), col = `rgb(${c})`, slump = 1 - t;

  return `<svg class="char" viewBox="0 0 200 320" style="--cc:${col};--pulse:${(1.1 + t * 3).toFixed(2)}s">

      <g style="filter:drop-shadow(0 0 ${(8 + t * 14).toFixed(0)}px ${col})">
        <circle cx="100" cy="66" r="24" fill="${col}"/>
        <path fill="${col}" d="M100 96 C72 96 54 109 50 137 L42 204 C41 214 54 216 56 206 L64 154 L66 288 C66 298 83 298 84 288 L91 210 L109 210 L116 288 C117 298 134 298 134 288 L136 154 L144 206 C146 216 159 214 158 204 L150 137 C146 109 128 96 100 96Z"/>
      </g>
    </g>
    ${orbit}
  </svg>`;
}

/* ======================= статистика месяца ======================= */
function statsHtml(bym) {
  const txs = S.tx.filter(t => txBym(t) === bym && t.type === 'expense');
  if (!txs.length) return '';
  const byCat = {};
  for (const t of txs) byCat[t.cat] = (byCat[t.cat] || 0) + t.amount;
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = cats[0][1], total = txs.reduce((s, t) => s + t.amount, 0);
  const log = S.meta.limitLog || {};
  const from = bStart(bym) > (S.profile.startDate || '') ? bStart(bym) : S.profile.startDate;
  const to = bEnd(bym) < dayKey() ? bEnd(bym) : dayKey();
  const days = [];
  for (let k = from; k <= to; k = addDays(k, 1)) days.push({ k, s: spentOn(k), L: log[k] ?? null });
  const dmax = Math.max(1, ...days.map(d => Math.max(d.s, d.L || 0)));
  const over = days.filter(d => d.L != null && d.s > d.L + 1).length;
  const W = 320, Hh = 110, bw = Math.max(3, Math.min(16, (W - 10) / days.length - 3));
  const step = (W - 10) / Math.max(1, days.length);
  const bars = days.map((d, i) => {
    const x = 5 + i * step + (step - bw) / 2, h = d.s / dmax * (Hh - 14), isOver = d.L != null && d.s > d.L + 1;
    return `<rect x="${x.toFixed(1)}" y="${(Hh - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="2" fill="${isOver ? 'var(--bad)' : 'var(--accent)'}" opacity="${d.k === dayKey() ? .55 : .9}"><title>${shortDate(d.k)}: ${fmt(d.s)} ₸${d.L != null ? ' / лимит ' + fmt(d.L) : ''}</title></rect>`
      + (d.L != null ? `<line x1="${(x - 1).toFixed(1)}" x2="${(x + bw + 1).toFixed(1)}" y1="${(Hh - d.L / dmax * (Hh - 14)).toFixed(1)}" y2="${(Hh - d.L / dmax * (Hh - 14)).toFixed(1)}" stroke="#e8edf5" stroke-opacity=".55" stroke-width="1.5"/>` : '');
  }).join('');
  return `<div class="card"><div class="card-h"><span class="card-t">Траты по категориям</span><span class="sub mono">${fmt(total)} ₸</span></div>
      ${cats.map(([id, v]) => { const c = cat(id); return `<div class="catrow"><span class="emo">${c.e}</span><span class="cn">${esc(c.n)}</span><span class="cb"><i style="width:${v / max * 100}%"></i></span><span class="cv mono">${sMoney(v)}</span><span class="cp">${Math.round(v / total * 100)}%</span></div>`; }).join('')}
    </div>
    <div class="card"><div class="card-h"><span class="card-t">Траты по дням</span><span class="sub mono">${over ? `<span style="color:var(--bad)">▲ ${over}</span> выше лимита` : 'в рамках лимита'}</span></div>
      <svg viewBox="0 0 ${W} ${Hh + 2}" style="width:100%;height:auto;display:block">${bars}<line x1="0" x2="${W}" y1="${Hh + .5}" y2="${Hh + .5}" stroke="rgba(255,255,255,.12)"/></svg>
      <div class="bar-meta"><span>${shortDate(from)}</span><span>━ лимит дня · <span style="color:var(--bad)">■</span> перерасход</span><span>${shortDate(to)}</span></div></div>`;
}

async function fillInstallDiag() {
  const el = document.getElementById('instDiag'); if (!el) return;
  const row = (ok, t) => `${ok === true ? '✅' : ok === false ? '❌' : '•'} ${t}`;
  const out = [];

  try { const href = document.querySelector('link[rel=manifest]').href; man = await (await fetch(href, { cache: 'no-store' })).json(); } catch (e) {}

  if (man && !man.id) out.push(row(false, 'Загрузите на GitHub новый manifest.webmanifest из архива'));
  let iconOk = false;

  out.push(row(iconOk, iconOk ? 'Иконки на месте' : 'Нет папки icons с иконками — загрузите её'));
  const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
  out.push(row(!!(reg && reg.active), reg && reg.active ? 'Офлайн-режим (service worker) работает' : 'Service worker ещё не запущен — обновите страницу'));
  out.push(row(bipFired, bipFired ? 'Chrome разрешил установку — нажмите кнопку выше' : 'Chrome не предложил установку'));
  if (!bipFired && man && man.id && iconOk && reg && reg.active) out.push(`<br>Всё в порядке с файлами, значит Chrome считает приложение <b>уже установленным</b>. Проверьте: <b>Настройки телефона → Приложения</b> — найдите «Финансы» или «Finance Flow» и удалите. Затем удалите ярлык с рабочего стола, закройте Chrome (смахните из недавних) и откройте сайт снова.<br>На компьютере кнопка установки — значок ⊕ справа в адресной строке.`);
  el.innerHTML = out.join('<br>');
}

function openTx(id, preset = {}) {
  const t = id ? S.tx.find(x => x.id === id) : null;
  if (t && t.occKey) return openOcc(t.occKey);
  if (t && t.goalId && findGoal(t.goalId)) return t.type === 'save' ? openGoalHist(t.goalId) : openGoalForm(t.goalId);
  if (t && t.type === 'adjust') {
    openSheet(`<h2>Корректировка баланса</h2><p class="sub">${longDate(t.date)} · ${esc(t.name || 'Сверка баланса')}</p>
      <div class="kv"><span>Изменение</span><span>${t.amount > 0 ? '+' : '−'}${fmt(Math.abs(t.amount))} ₸</span></div>
      <p class="note" style="margin:12px 0">Чтобы поправить баланс ещё раз, сделайте новую сверку — она учтёт эту.</p>
      <div class="row"><button class="btn ghost" data-adj="new">Сверить заново</button><button class="btn danger" data-adj="del">Удалить</button></div>`);
    sheetHandler = e => { const b = e.target.closest('[data-adj]'); if (!b) return;
      if (b.dataset.adj === 'new') openAdjust();
      if (b.dataset.adj === 'del' && confirm('Удалить корректировку?')) { S.tx = S.tx.filter(x => x.id !== t.id); afterChange('Удалено'); } };
    return;
  }
  let type = t ? t.type : preset.type || 'expense', ctg = t ? t.cat : 'food';
  const F = forecast(), left = Math.max(0, F.L) - F.spent;
  const draw = keep => {
    const v = keep || { amount: t ? fmt(t.amount) : '', note: t ? (t.note || t.name || '') : '', date: t ? t.date : dayKey() };
    const isExp = type === 'expense';
    openSheet(`
      <h2>${t ? 'Изменить операцию' : type === 'income' ? 'Доход вне расписания' : 'Новая трата'}</h2>
      <p class="sub">${isExp && !t ? `Сегодня ещё можно: <b class="mono" style="color:var(--text)">${money(left)}</b>` : t ? TX_T[t.type] : 'Подарок, премия, возврат долга и т.п.'}</p>
      ${t && t.type !== 'adjust' ? `<div class="stabs">${['expense', 'income'].map(k => `<button data-ty="${k}" class="${k === type ? 'on' : ''}">${TX_T[k]}</button>`).join('')}</div>` : ''}
      <div class="field"><input id="txAmt" class="huge" inputmode="numeric" data-money placeholder="0" value="${v.amount}"><span class="u">₸</span></div>
      ${isExp ? `<div class="cats">${S.cats.map(c => `<button data-cat="${c.id}" class="${c.id === ctg ? 'on' : ''}"><span>${c.e}</span>${esc(c.n)}</button>`).join('')}</div>` : ''}
      <div class="field"><label>${isExp ? 'Заметка' : 'Название'}</label><input id="txNote" class="txt" maxlength="60" placeholder="${isExp ? 'кофе, такси…' : 'премия, возврат…'}" value="${esc(v.note)}"></div>
      <div class="field"><label>Дата</label><input id="txDate" type="date" value="${v.date}" max="${dayKey()}"></div>
      <button class="btn block" id="txOk">${t ? 'Сохранить' : 'Добавить'}</button>
      ${t ? '<button class="btn danger block" style="margin-top:8px" id="txDel">Удалить</button>' : ''}`);
    const amt = $('#txAmt');
    if (!t && !keep) setTimeout(() => amt.focus(), 260);
    const remember = () => ({ amount: amt.value, note: $('#txNote').value, date: $('#txDate').value });
    sheetHandler = e => {
      const c = e.target.closest('[data-cat]'); if (c) { ctg = c.dataset.cat; $$('.cats button').forEach(b => b.classList.toggle('on', b === c)); return; }
      const ty = e.target.closest('[data-ty]'); if (ty) { const k = remember(); type = ty.dataset.ty; draw(k); }
    };
    const ok = () => {
      const a = parseMoney(amt.value);

/* ---------- событие расписания (конкретный месяц) ---------- */

  const F = forecast();
  let o = F.occ.find(x => x.key === key);

  return o;
}
function openOcc(key) {

  if (!o.flex && !o.win && o.raw !== o.date && !o.st.date) info += `<div class="kv"><span>Перенос</span><span>с ${shortDate(o.raw)} (${holidayName(o.raw) || 'выходной'})</span></div>`;
  if (o.flex) { const p = forecast().flexPlan.find(x => x.o.key === key); info += `<div class="kv"><span>Срок</span><span>до ${longDate(o.date)}</span></div>${p && p.src ? `<div class="kv"><span>Источник</span><span>${esc(p.src.name)}</span></div>` : ''}${p && p.why ? `<p class="note" style="margin-top:8px">Можно и ${longDate(p.why.alt)}, лимит не изменится, но ${longDate(p.why.worst)} запас на счету упадёт до ${money(Math.max(0, p.why.room))}.</p>` : ''}`; }
  info += `<div class="kv"><span>Сумма</span><span>${fmt(o.amount)} ₸${it.mode === 'dec' && o.st.amt == null && it.overrides[o.ym] == null ? ' · оценка' : ''}</span></div>`;
  info += `<div class="kv"><span>Бюджет</span><span>${ymNameShort(o.bym)} (${bRange(o.bym)})</span></div>`;

    body = `<div class="banner yel" style="border-color:rgba(62,224,143,.4);background:rgba(62,224,143,.07)"><span class="ic">✓</span><span>${inc ? 'Получено' : 'Оплачено'}${tx ? ` ${longDate(tx.date)}: <b>${fmt(tx.amount)} ₸</b>${tx.noBal ? ' (баланс не менялся)' : ''}` : ''}</span></div>
      ${tx ? '<button class="btn ghost block" data-oc="edittx">Изменить сумму или дату</button>' : ''}

  } else if (o.status === 'skip') {
    body = `<div class="banner yel"><span class="ic">⏭</span><span>Пропущено в этом месяце — в расчётах не участвует.</span></div>
      <button class="btn ghost block" data-oc="undo">Вернуть в план</button>`;
  } else {
    body = `<div class="row"><button class="btn ${inc ? 'green' : ''}" data-oc="ok">${inc ? 'Пришло' : o.flex ? 'Отдал' : 'Оплачено'}</button><button class="btn ghost" data-oc="skip">Пропустить месяц</button></div>
      <button class="btn ghost block" style="margin-top:8px" data-oc="plan">Изменить сумму или дату в этом месяце</button>`;
  }
  openSheet(`<h2>${inc ? '💰' : o.flex ? '🤝' : '📌'} ${esc(o.name)}</h2><p class="sub">${ymNameShort(o.ym)} · ${inc ? 'доход' : 'обязательный платёж'}</p>
    <div style="margin-bottom:14px">${info}</div>${body}
    <button class="link" style="display:block;margin:16px auto 0" data-oc="rule">правило «${esc(it.name)}» для всех месяцев →</button>`);
  sheetHandler = e => {
    const b = e.target.closest('[data-oc]'); if (!b) return;
    const a = b.dataset.oc;
    if (a === 'ok') openConfirm(key);

const ruleDateOf = o => o.flex ? null : shiftDay(ymDay(o.ym, o.it.dayTo || o.it.day), o.it.shift);

/* ---------- правило расписания ---------- */
function openItem(id, kindNew) {
  const old = id ? item(id) : null;
  const d = old ? JSON.parse(JSON.stringify(old)) : normItem({ kind: kindNew, amount: 0, day: kindNew === 'income' ? 15 : 1, startMonth: ymOf(dayKey()) });
  if (!old) d.name = '';
  let dateMode = d.flexible ? 'flex' : d.dayTo ? 'win' : 'day';
  let handler = null;
  const draw = () => {
    const inc = d.kind === 'income';
    openSheet(`<h2>${old ? 'Правило' : inc ? 'Новый доход' : 'Новый платёж'}</h2><p class="sub">${old ? 'Изменения применятся ко всем месяцам, кроме вручную изменённых' : 'Повторяется каждый месяц'}</p>
      <div class="field"><label>Название</label><input id="itName" class="txt" maxlength="40" placeholder="${inc ? 'Зарплата' : 'Аренда'}" value="${esc(d.name)}"></div>
      ${!inc ? `<div class="stabs">${[['fixed', 'Фиксированная сумма'], ['dec', 'Убывающая']].map(([k, l]) => `<button data-md="${k}" class="${d.mode === k ? 'on' : ''}">${l}</button>`).join('')}</div>` : ''}
      <div class="field"><label>${d.mode === 'dec' ? 'Платёж в первый месяц' : 'Сумма'}</label><input id="itAmt" inputmode="numeric" data-money value="${d.amount ? fmt(d.amount) : ''}" placeholder="0"><span class="u">₸</span></div>
      ${d.mode === 'dec' ? `<div class="field"><label>Всего выплатить за весь срок</label><input id="itTotal" inputmode="numeric" data-money value="${d.total ? fmt(d.total) : ''}" placeholder="2 000 000"><span class="u">₸</span>
        <div class="hint">Платёж будет равномерно снижаться. Точную сумму любого месяца можно поправить в календаре.</div></div>` : ''}
      <div class="field" style="margin-bottom:6px"><label>Когда</label></div>
      <div class="stabs">${[['day', 'Число месяца'], inc ? ['win', 'Окно дат'] : ['flex', 'Любой день месяца']].map(([k, l]) => `<button data-dm="${k}" class="${dateMode === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${dateMode === 'flex' ? '<p class="note" style="margin:-4px 0 12px">Алгоритм сам подберёт лучший день в каждом месяце и подскажет, из какого дохода платить.</p>' : `
        <div class="${dateMode === 'win' ? 'two' : ''}">
          <div class="field"><label>${dateMode === 'win' ? 'С какого числа' : 'Число'}</label><input id="itDay" inputmode="numeric" value="${d.day}"></div>
          ${dateMode === 'win' ? `<div class="field"><label>По какое</label><input id="itDayTo" inputmode="numeric" value="${d.dayTo || Math.min(31, d.day + 4)}"></div>` : ''}
        </div>
        <p class="note" style="margin:-4px 0 12px">31 = последний день месяца.${dateMode === 'win' ? ' В лимите доход учитывается по последнему дню окна.' : ''}</p>
        <div class="field" style="margin-bottom:6px"><label>Если выпадает на выходной или праздник</label></div>
        <div class="stabs">${[['before', 'Раньше'], ['after', 'Позже'], ['none', 'Не переносить']].map(([k, l]) => `<button data-sh="${k}" class="${d.shift === k ? 'on' : ''}">${l}</button>`).join('')}</div>`}
      <div class="two">
        <div class="field"><label>С месяца</label><input id="itStart" type="month" value="${d.startMonth}"></div>
        <div class="field"><label>По месяц${d.mode === 'dec' ? '' : ' (необяз.)'}</label><input id="itEnd" type="month" value="${d.endMonth || ''}"></div>
      </div>
      ${dateMode === 'flex' ? '<p class="note" style="margin:-4px 0 12px">Окно — бюджетный месяц: от первой зарплаты месяца до следующей.</p>'
        : `<label class="toggle"><span>Относится к прошлому месяцу<small>${inc ? 'оплата за работу прошлого месяца, приходит в начале следующего' : 'закрывается деньгами прошлого месяца (аренда 1-го, кредиты 2-го)'}</small></span><input type="checkbox" id="itPrev" ${d.prevMonth ? 'checked' : ''}></label>`}
      ${!inc ? `<label class="toggle"><span>Долг / кредит<small>учитывается в долговой нагрузке индекса здоровья</small></span><input type="checkbox" id="itDebt" ${d.isDebt ? 'checked' : ''}></label>` : ''}
      ${old ? `<label class="toggle"><span>На паузе<small>временно не участвует в расчётах</small></span><input type="checkbox" id="itPause" ${d.paused ? 'checked' : ''}></label>` : ''}
      <button class="btn block" id="itOk">${old ? 'Сохранить' : 'Добавить'}</button>
      ${old ? '<button class="btn danger block" style="margin-top:8px" id="itDel">Удалить правило</button>' : ''}`);
    if (!old && !d.name) setTimeout(() => $('#itName').focus(), 260);
    sheetHandler = handler;
  };
  const collect = () => {
    d.name = $('#itName').value;
    const a = parseMoney($('#itAmt').value); d.amount = a || 0;
    if ($('#itTotal')) d.total = parseMoney($('#itTotal').value);
    if ($('#itDay')) d.day = Math.round(+$('#itDay').value) || d.day;
    if ($('#itDayTo')) d.dayTo = Math.round(+$('#itDayTo').value) || null;
    d.startMonth = $('#itStart').value || d.startMonth;
    d.endMonth = $('#itEnd').value || null;
    if ($('#itPause')) d.paused = $('#itPause').checked;
    if ($('#itPrev')) d.prevMonth = $('#itPrev').checked;
    if ($('#itDebt')) d.isDebt = $('#itDebt').checked;
  };
  handler = e => {
    const b = e.target.closest('[data-md],[data-dm],[data-sh]'); if (b) {
      collect();
      if (b.dataset.md) d.mode = b.dataset.md;
      if (b.dataset.dm) dateMode = b.dataset.dm;
      if (b.dataset.sh) d.shift = b.dataset.sh;
      draw(); return;
    }
    if (e.target.id === 'itOk') {
      collect();
      if (!d.name.trim()) return shake($('#itName'));
      if (!(d.amount > 0)) return shake($('#itAmt'));
      d.flexible = dateMode === 'flex';
      if (dateMode !== 'win') d.dayTo = null;
      if (dateMode === 'day' || dateMode === 'win') {
        if (!(d.day >= 1 && d.day <= 31)) return shake($('#itDay'));
        if (dateMode === 'win' && !(d.dayTo >= d.day && d.dayTo <= 31)) { toast('Конец окна должен быть не раньше начала'); return shake($('#itDayTo')); }
      }
      if (d.endMonth && d.endMonth < d.startMonth) { toast('Конец раньше начала'); return shake($('#itEnd')); }
      if (d.mode === 'dec') {
        if (!d.endMonth) { toast('Для убывающего платежа нужен последний месяц'); return shake($('#itEnd')); }
        if (!(d.total > 0)) return shake($('#itTotal'));
        const n = monthsBetween(d.startMonth, d.endMonth) + 1;
        if (d.total < d.amount) { toast('Общая сумма меньше первого платежа'); return shake($('#itTotal')); }
        if (n > 1 && 2 * d.total / n - d.amount < 0) { toast(`Не сходится: при первом платеже ${fmt(d.amount)} и ${n} мес. последний ушёл бы в минус. Увеличьте общую сумму или срок`); return shake($('#itTotal')); }
      }
      d.name = d.name.trim();
      const clean = normItem(d);
      if (old) Object.assign(old, clean); else S.schedule.push(clean);
      afterChange(old ? 'Правило сохранено, лимит пересчитан' : `«${clean.name}» добавлено`);
    }
    if (e.target.id === 'itDel' && confirm(`Удалить «${old.name}»? Операции в журнале останутся.`)) {
      S.schedule = S.schedule.filter(x => x.id !== old.id);
      for (const k of Object.keys(S.occ)) if (k.startsWith(old.id + '|')) delete S.occ[k];
      afterChange('Правило удалено');
    }
  };
  draw();
}

  const list = [...offMap(y).entries(), ...offMap(y + 1).entries()].filter(([k]) => k >= dayKey()).sort((a, b) => a[0] < b[0] ? -1 : 1);
  openSheet(`<h2>Праздники и выходные</h2><p class="sub">Учитываются при переносе дат. Переносы выходных по постановлениям правительства и Курбан айт добавляйте вручную.</p>
    <ul class="list">${list.slice(0, 30).map(([k, n]) => `<li><span class="cal-day" style="flex:0 0 52px"><b style="font-size:14px">${shortDate(k)}</b><span>${wd(k)}</span></span><span class="grow">${esc(n)}</span>
      ${S.holidays.includes(k) ? `<button class="x link" data-hd="${k}">убрать</button>` : ''}</li>`).join('')}</ul>
    <div class="field" style="margin-top:14px"><label>Добавить нерабочий день</label><input id="hdDate" type="date"></div>
    <button class="btn block" id="hdOk">Добавить</button>`);
  $('#hdOk').onclick = () => {
    const k = $('#hdDate').value; if (!k) return shake($('#hdDate'));
    if (!S.holidays.includes(k)) S.holidays.push(k);
    save(); render(); openHol(); toast('Добавлено — даты пересчитаны');
  };
  sheetHandler = e => { const b = e.target.closest('[data-hd]'); if (b) { S.holidays = S.holidays.filter(x => x !== b.dataset.hd); save(); render(); openHol(); } };
}

/* ---------- экспорт / импорт ---------- */
function exportData() {
  S.meta.lastBackup = new Date().toISOString(); save();
  const blob = new Blob([JSON.stringify({ app: 'finance-flow', schema: 1, exportedAt: S.meta.lastBackup, data: S }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `finance-backup-${dayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Бэкап сохранён в загрузки'); render();
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const raw = JSON.parse(r.result);
      if (raw.app !== 'finance-flow') throw 0;
      if (raw.template && Array.isArray(raw.schedule)) {
        // файл-шаблон расписания: заменяет только доходы и платежи, журнал и баланс не трогает
        if (S.schedule.length && !confirm(`Заменить расписание (${S.schedule.length} правил) на правила из файла (${raw.schedule.length})?`)) return;
        S.schedule = raw.schedule.map(normItem); S.occ = {};
        save(); closeSheet(); render(); if ($('#onb').classList.contains('open')) renderOnb();
        toast(`Загружено правил: ${S.schedule.length}`);
        return;
      }
      const n = normalize(raw.data);
      if (!confirm(`Загрузить бэкап?\nправил: ${n.schedule.length}, операций: ${n.tx.length}\n\nТекущие данные будут заменены.`)) return;
      S = n; save(); $('#onb').classList.remove('open'); render(); toast('Данные восстановлены');
    } catch (e) { toast('Это не файл Finance Flow'); }
  };
  r.readAsText(file);
}

/* ---------- онбординг ---------- */
let onbStep = 0, onbMode = 'today', onbStartNow = false;
const nextMonth1 = () => nextBudgetStart();
const waiting = () => S.profile.onboarded && S.profile.startBalance == null;
function openOnb(step = 0, startNow = false) { onbStep = step; onbStartNow = startNow; onbMode = 'today'; $('#onb').classList.add('open'); renderOnb(); }
function renderOnb() {
  let h;
  if (onbStep === 0) h = `<div class="onb-body"><div class="onb-logo">₸</div><h2>Finance Flow</h2>
      <p>Честный дневной лимит с учётом всех зарплат, кредитов и платежей на год вперёд. Плюс подсказки, когда и из чего платить.</p>
      ${S.schedule.length ? `<div class="banner yel" style="border-color:rgba(62,224,143,.4);background:rgba(62,224,143,.07)"><span class="ic">✓</span><span>Расписание загружено: ${S.schedule.length} правил</span></div>` : ''}
    </div>
    <button class="btn block" id="onNext">${S.schedule.length ? 'Дальше' : 'Начать'}</button>
    ${S.schedule.length ? '' : '<button class="btn ghost block" style="margin-top:8px" id="onImp">Импортировать файл</button>'}`;
  else if (onbStartNow) h = `<div class="onb-body"><h2>Начинаем учёт ☀️</h2>
      <p>Введите, сколько сейчас денег на карте (на всех счетах, которые используете на жизнь). Всё, что пришло и ушло до этого момента, считается уже учтённым.</p>
      <div class="field"><input id="onBal" class="huge" inputmode="numeric" data-money placeholder="0"><span class="u">₸</span></div>
      <p class="note">Вводите баланс до прихода сегодняшней зарплаты, а потом отметьте её «Пришло». Если она уже пришла — введите баланс с ней и отметьте «Уже учтено в балансе».</p></div>
    <button class="btn block" id="onDone">Начать</button>`;
  else {
    const nm = nextMonth1();
    h = `<div class="onb-body"><h2>С какого дня вести учёт?</h2>
      <div class="stabs" style="margin-bottom:18px"><button data-om="today" class="${onbMode === 'today' ? 'on' : ''}">С сегодня</button><button data-om="next" class="${onbMode === 'next' ? 'on' : ''}">С бюджета ${MON_G2(ymOf(nm))}</button></div>
      ${onbMode === 'today' ? `<p>Текущий баланс на карте (на всех счетах, которые используете на жизнь). С него начнётся расчёт. Позже его всегда можно сверить.</p>
        <div class="field"><input id="onBal" class="huge" inputmode="numeric" data-money placeholder="0"><span class="u">₸</span></div>
        <p class="note">Если сегодня уже пришла зарплата или прошёл платёж — вводите баланс после них, а событие в календаре отметьте «Уже учтено в балансе».</p>`
      : `<p>Бюджет ${MON_G2(ymOf(nm))} начинается <b style="color:var(--text)">${longDate(nm)}</b> — с первой зарплаты месяца. Аренда, кредиты и доходы начала месяца до этой даты относятся к прошлому бюджету. До этого можно посмотреть план, а лимит и журнал включатся в этот день.</p>
        <div class="banner yel"><span class="ic">📅</span><span>${longDate(nm)} приложение попросит остаток на карте до прихода зарплаты — хвост прошлого бюджета. Потом отметите ЗП «Пришло» — это первая запись нового месяца.</span></div>`}
    </div>
    <div class="row"><button class="btn ghost" id="onBack" style="flex:0 0 auto">Назад</button><button class="btn grow" id="onDone">${onbMode === 'today' ? 'Готово' : 'Начать с ' + longDate(nm)}</button></div>`;
  }
  $('#onb').innerHTML = h;
  if ($('#onNext')) $('#onNext').onclick = () => { onbStep = 1; renderOnb(); };
  if ($('#onImp')) $('#onImp').onclick = () => $('#importFile').click();
  if ($('#onBack')) $('#onBack').onclick = () => { onbStep = 0; renderOnb(); };
  $$('#onb [data-om]').forEach(b => b.onclick = () => { onbMode = b.dataset.om; renderOnb(); });
  if ($('#onBal')) { setTimeout(() => $('#onBal').focus(), 200); onEnter($('#onBal'), finishOnb); }
  if ($('#onDone')) $('#onDone').onclick = finishOnb;
}
function finishOnb() {
  if (!onbStartNow && onbMode === 'next') {
    Object.assign(S.profile, { startBalance: null, startDate: nextMonth1(), onboarded: true });
    S.tx = []; S.occ = {};
    save(); $('#onb').classList.remove('open'); go('cal');
    toast(`Учёт начнётся ${longDate(S.profile.startDate)}. Пока можно посмотреть план`);
    return;
  }
  const v = parseMoney($('#onBal').value);
  if (v == null) return shake($('#onBal'));
  // учёт начинается с момента ввода баланса: всё, что было раньше, уже внутри баланса
  Object.assign(S.profile, { startBalance: v, startDate: dayKey(), onboarded: true });
  S.tx = []; S.occ = {};
  save(); $('#onb').classList.remove('open');
  go(S.schedule.length ? 'home' : 'plan');
  toast(S.schedule.length ? 'Готово! Лимит рассчитан' : 'Добавьте доходы и платежи');
}
// день старта наступил — спросить баланс
function checkStart() {
  if (waiting() && dayKey() >= S.profile.startDate && !$('#onb').classList.contains('open')) openOnb(1, true);
}

/* ======================= события ======================= */
$('#tabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) go(t.dataset.tab); });
$('#fab').onclick = () => openTx(null);
$('#sheetBg').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#sheetBody').addEventListener('click', e => { if (e.target.closest('[data-close]')) return closeSheet(); sheetHandler && sheetHandler(e); });
$('#sheetBody').addEventListener('input', e => sheetInput && sheetInput(e));
$('#importFile').onchange = e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; };
document.addEventListener('input', e => {
  if (!e.target.matches('[data-money]')) return;
  const neg = /^\s*[-−]/.test(e.target.value) && e.target.id === 'adAmt';
  const digits = e.target.value.replace(/\D/g, '').slice(0, 12);
  e.target.value = digits ? (neg ? '-' : '') + fmt(+digits) : (neg ? '-' : '');
});
$('#app').addEventListener('click', e => {
  const okb = e.target.closest('[data-occ-ok]'); if (okb) return openConfirm(okb.dataset.occOk);
  const al = e.target.closest('[data-alloc]'); if (al) return openAlloc(al.dataset.alloc);
  const gb = e.target.closest('[data-g]'); if (gb) return onGoalAct(e);
  const oc = e.target.closest('[data-occ]'); if (oc && oc.dataset.occ.startsWith('goal|')) return openGoalForm(oc.dataset.occ.slice(5));
  if (oc) {
    const o = findOcc(oc.dataset.occ);
    if (o && o.kind === 'income' && !o.status && screen === 'cal') return openOccMenu(oc.dataset.occ);
    return openOcc(oc.dataset.occ);
  }
  const tx = e.target.closest('[data-tx]'); if (tx) return openTx(tx.dataset.tx);
  const it = e.target.closest('[data-item]'); if (it) return openItem(it.dataset.item);
  const nw = e.target.closest('[data-new]'); if (nw) return openItem(null, nw.dataset.new);
  const lm = e.target.closest('[data-lm]'); if (lm && !lm.disabled) { logYm = ymAdd(logYm, +lm.dataset.lm); return renderLog(); }
  const lf = e.target.closest('[data-lf]'); if (lf) { logFilter = lf.dataset.lf; return renderLog(); }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'adjust') openAdjust();
  if (act === 'health') openHealth();
  if (act === 'install') doInstall();
  if (act === 'addIncome') openTx(null, { type: 'income' });
  if (act === 'log') go('log');
  if (act === 'plan') go('plan');
  if (act === 'export') exportData();
  if (act === 'import') $('#importFile').click();
  if (act === 'cats') openCats();
  if (act === 'hol') openHol();
  if (act === 'start') openOnb(1, true);
  if (act === 'cal') go('cal');
  if (act === 'restart') {
    if (!confirm('Начать учёт заново? Журнал операций и отметки календаря обнулятся, расписание останется. Сначала лучше сделать экспорт.')) return;
    openOnb(1);
  }
  if (act === 'reset') {
    if (!confirm('Удалить все данные? Сначала лучше сделать экспорт.')) return;
    if (!confirm('Точно? Действие нельзя отменить.')) return;
    localStorage.removeItem(KEY); S = defaults(); save(); render(); openOnb();
  }
});
// для дохода в календаре: распределение или отметка
function openOccMenu(key) {
  const o = findOcc(key);
  openOcc(key);
  const body = $('#sheetBody');
  body.insertAdjacentHTML('beforeend', `<button class="btn ghost block" style="margin-top:8px" data-alloc-in="${key}">📊 Распределение этого дохода</button>`);
  const prev = sheetHandler;
  sheetHandler = e => { const b = e.target.closest('[data-alloc-in]'); if (b) return openAlloc(key); prev && prev(e); };
}

let lastDay = dayKey();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  try { S = normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) {}
  ver++; offCache = {};
  if (dayKey() !== lastDay) { lastDay = dayKey(); if (!waiting()) toast('Новый день — лимит пересчитан'); }
  render(); checkStart();
});
window.addEventListener('storage', e => { if (e.key === KEY) { S = normalize(JSON.parse(e.newValue)); ver++; render(); } });

/* ======================= старт ======================= */
render();
if (!S.profile.onboarded) openOnb(); else checkStart();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.__fin = { forecast, genOcc, allocation, get S() { return S; } };   // для отладки
})();
</script>
</body>
</html>
